name: acceptance
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project:
          - cmake
          - harfbuzz
          - llvm
          - ninja
        exclude:
          - project: ${{ github.ref != 'refs/heads/main' && 'llvm' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: raviqqe/enable-homebrew@6bd383659a321c332bd0c0ed445c32d54e04efe8 # v1.0.5
      - run: brew install meson ninja
      - run: tools/build.sh
      - run: tools/acceptance_test.sh ninja ${{ matrix.project }}
      - run: tools/acceptance_test.sh turtle ${{ matrix.project }}
  acceptance:
    needs:
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
