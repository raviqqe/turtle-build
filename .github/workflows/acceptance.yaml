name: acceptance
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project:
          - cmake
          - harfbuzz
          - llvm
          - ninja
        exclude:
          - project: ${{ github.ref != 'refs/heads/main' && 'llvm' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: swatinem/rust-cache@v2.9.3
      - uses: raviqqe/enable-homebrew@v1.0.6
      - run: brew install meson ninja
      - run: tools/build.sh
      - run: tools/acceptance_test.sh ninja ${{ matrix.project }}
      - run: tools/acceptance_test.sh turtle ${{ matrix.project }}
  acceptance:
    needs:
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
