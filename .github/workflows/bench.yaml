name: bench
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  command:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: swatinem/rust-cache@v2.9.3
      - uses: raviqqe/enable-homebrew@v1.0.6
      - run: brew install ninja
      - run: cargo install --path . --locked
      - run: tools/bench.sh
      - run: tools/bench_metrics.sh ${{ matrix.os }} > ${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: ${{ matrix.os }}.json
  report:
    needs:
      - command
    permissions:
      actions: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bench-*
          merge-multiple: true
          path: tmp/bench
      - run: jq -s . tmp/bench/*.json > tmp/bench.json
      - uses: k1low/octocov-action@v1.5.2
        env:
          OCTOCOV_CUSTOM_METRICS_BENCH: tmp/bench.json
  bench:
    needs:
      - command
      - report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
