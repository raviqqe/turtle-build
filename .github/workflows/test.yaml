name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: swatinem/rust-cache@v2.9.3
      - run: tools/build.sh
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.os }}
          path: |
            target/release/turtle
            target/release/turtle.exe
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: swatinem/rust-cache@v2.9.3
      - run: cargo test --all-features
  integration_test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
            options: -t ~@unix
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-${{ matrix.os }}
          path: target/release
      - run: chmod +x target/release/turtle*
      - run: tools/integration_test.sh ${{ matrix.options }}
  integration_test_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: raviqqe/enable-homebrew@v1.0.6
      - run: brew install ninja
      - run: mkdir -p target/release
      - run: cp tools/turtle.sh target/release/turtle
      - run: tools/integration_test.sh -t ~@turtle
  test:
    needs:
      - build
      - unit_test
      - integration_test
      - integration_test_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
