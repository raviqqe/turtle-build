[package]
name = "turtle-build"
version = "0.4.10"
edition = "2024"
description = "Ninja-compatible build system for high-level programming languages"
repository = "https://github.com/raviqqe/turtle"
license = "MIT OR Apache-2.0"
publish = true

[[bin]]
name = "turtle"
path = "src/main.rs"

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
bincode = "2.0.1"
clap = { version = "4.6.3", features = ["derive", "env"] }
dashmap = "6.2.1"
futures = "0.3.34"
itertools = "0.15.0"
nom = "8.0.0"
num_cpus = "1.17.0"
once_cell = "1.21.4"
petgraph = "0.8.3"
rand = "0.10.1"
regex = "1.13.1"
sled = "0.34.7"
tokio = { version = "1.53.1", features = ["full"] }
train-map = "0.1.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
