[package]
name = "turtle-build"
version = "0.5.7"
edition = "2024"
description = "Ninja-compatible build system for high-level programming languages"
repository = "https://github.com/raviqqe/turtle"
license = "MIT OR Apache-2.0"
publish = true

[[bin]]
name = "turtle"
path = "src/main.rs"

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
bincode = "2.0.1"
clap = { version = "4.6.3", features = ["derive", "env"] }
fjall = "3.1.10"
futures = "0.3.34"
itertools = "0.15.0"
nom = "8.0.0"
num_cpus = "1.17.0"
once_cell = "1.21.4"
petgraph = "0.8.3"
rand = "0.10.1"
redb = "4.3.0"
regex = "1.13.1"
rlimit = "0.11.0"
scc = "3.8.8"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
train-map = "0.1.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.clippy]
alloc_instead_of_core = "deny"
dbg_macro = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
explicit_deref_methods = "deny"
if_not_else = "deny"
manual_let_else = "deny"
missing_const_for_fn = "deny"
option_if_let_else = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
todo = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unused_self = "deny"
use_self = "deny"

[lints.rust]
missing_docs = "deny"
warnings = "deny"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
